<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#500000" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#grid)"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#500000" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#500000" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="#500000" stroke-width="2" opacity="0.4"/>
</svg>
